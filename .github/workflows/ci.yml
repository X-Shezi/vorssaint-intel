name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  diagnose:
    name: Diagnose Intel unit-test abort
    if: github.event_name == 'pull_request' && github.head_ref == 'diagnose/intel-test-abort'
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Metal device report
        run: |
          cat > "$RUNNER_TEMP/probe.swift" <<'EOF'
          import Foundation
          import Metal

          print("default:", MTLCreateSystemDefaultDevice() as Any)
          let devices = MTLCopyAllDevices()
          print("copied devices:", devices.count)
          for device in devices {
              let architecture = (device as? NSObject)?.value(forKey: "architecture")
              print("name:", device.name, "registry:", device.registryID,
                    "architecture:", architecture as Any, "architectureIsNil:", architecture == nil)
          }
          EOF
          swiftc -o "$RUNNER_TEMP/probe" "$RUNNER_TEMP/probe.swift"
          "$RUNNER_TEMP/probe"

      - name: Crash report
        if: always()
        run: |
          ls -la "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null || true
          latest=$(ls -t "$HOME/Library/Logs/DiagnosticReports"/*.ips 2>/dev/null | head -1)
          if [ -n "$latest" ]; then echo "=== $latest ==="; cat "$latest"; fi

  intel:
    name: Intel build & selftest
    if: github.head_ref != 'diagnose/intel-test-abort'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify Intel runner
        run: test "$(uname -m)" = x86_64

      - name: Build
        run: ARCH=x86_64 ./build.sh

      - name: Verify Intel bundle contents
        run: |
          file build/Vorssaint | grep -F x86_64
          file build/stage/Vorssaint.app/Contents/Frameworks/libVorssaintNowPlaying.dylib | grep -F x86_64
          test ! -e build/stage/Vorssaint.app/Contents/Library/LaunchServices/com.vorssaint.utils.fan-control
          test ! -e build/stage/Vorssaint.app/Contents/Library/LaunchDaemons/com.vorssaint.utils.fan-control.plist

      - name: Selftest
        run: ARCH=x86_64 ./build/Vorssaint --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Upload Intel DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vorssaint-intel-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Unit tests
        run: ARCH=x86_64 ./build.sh --test

  compatibility:
    name: Swift 6.0.3 compatibility
    if: github.head_ref != 'diagnose/intel-test-abort'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Unit tests
        run: ./build.sh --test

  build:
    name: Build & selftest
    if: github.head_ref != 'diagnose/intel-test-abort'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Unit tests
        run: ./build.sh --test
